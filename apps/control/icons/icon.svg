<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- LowRider Control: the gantry with its router over the table, seen from the front.
       Full-bleed square without transparency – iPadOS rounds the corners itself.
       Everything that matters lies in the middle 80 % (Android masks the rest). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2531" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fa" />
      <stop offset="1" stop-color="#c9d2de" />
    </linearGradient>
    <linearGradient id="carriage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bff" />
      <stop offset="1" stop-color="#2f6fe0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- table with the cut the router has made so far -->
  <rect x="72" y="362" width="368" height="42" rx="10" fill="#273142" />
  <rect x="72" y="362" width="368" height="8" rx="4" fill="#3a475c" />
  <rect x="120" y="362" width="136" height="8" rx="4" fill="#22c55e" />
  <!-- gantry: two side plates and the beam -->
  <rect x="96" y="150" width="44" height="212" rx="12" fill="url(#beam)" />
  <rect x="372" y="150" width="44" height="212" rx="12" fill="url(#beam)" />
  <rect x="96" y="150" width="320" height="52" rx="14" fill="url(#beam)" />
  <!-- carriage, router and bit -->
  <rect x="210" y="122" width="92" height="124" rx="16" fill="url(#carriage)" />
  <rect x="232" y="246" width="48" height="62" rx="8" fill="#2a5fc4" />
  <rect x="250" y="308" width="12" height="48" rx="3" fill="#e6ebf2" />
  <!-- where the tool is: the colour of "current" in the app -->
  <circle cx="256" cy="362" r="13" fill="#f2c230" />
</svg>
